# Format, lint, types, server tests and browser tests, on every pull request and on main. A warning only: merging
# doesn't require them, and the deploy (deploy.yml) doesn't wait for them. No secrets: the tests use local D1, test
# secrets and a local mail stub.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs vp (the version in pnpm-workspace.yaml's catalog), Node from .node-version and pnpm from
      # packageManager, then the dependencies exactly as locked.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp check
      - run: vp test
      - name: Install Chromium for the browser tests
        run: vp exec playwright install --with-deps chromium
      - run: vp run test:e2e
      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 7
