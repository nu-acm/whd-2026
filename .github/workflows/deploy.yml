# Production is main: every push to main migrates the production database and deploys. It doesn't wait for the checks
# (checks.yml runs them alongside). wrangler.jsonc names the account; the Worker's own secrets live on the Worker
# (`wrangler secret put`), so the only secret here is the Cloudflare API token (organization secret CLOUDFLARE_API_TOKEN).
name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time, and never cancelled halfway: a newer push waits instead of stopping a run between the migration
# and the deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No token here: the install runs dependencies' install scripts, which have no business seeing it.
      # Installs vp (the version in pnpm-workspace.yaml's catalog), Node from .node-version and pnpm from
      # packageManager, then the dependencies exactly as locked.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      # Migrations first, so the new code never runs against the old schema. The code that is still live then runs
      # against the new schema until the deploy below finishes (or for good, if it fails): see "Deployment" in
      # README.md. Already-applied migrations are skipped (wrangler records them in d1_migrations).
      - name: Migrate the production database
        run: vp run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
