allowBuilds:
  esbuild: true
  workerd: true
  '@prisma/client': false
  better-sqlite3: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.63.2'
  - '@cloudflare/workers-types@5.20261013.1'
  - '@tanstack/react-router@1.170.44'
  - '@tanstack/react-start-client@1.168.42'
  - '@tanstack/react-start-rsc@0.1.62'
  - '@tanstack/react-start-server@1.167.49'
  - '@tanstack/react-start@1.169.1'
  - '@tanstack/router-core@1.171.37'
  - '@tanstack/router-generator@1.167.43'
  - '@tanstack/router-plugin@1.168.45'
  - '@tanstack/start-client-core@1.170.37'
  - '@tanstack/start-plugin-core@1.171.52'
  - '@tanstack/start-server-core@1.169.42'
  - '@tanstack/start-storage-context@1.167.39'
  - '@testing-library/user-event@14.6.8'
  - framer-motion@14.2.0
  - lucide-react@1.56.0
  - miniflare@5.20261006.2-beta
  - motion-dom@14.2.0
  - motion-utils@14.1.1
  - motion@14.2.0
  - wrangler@4.150.0
overrides:
  vite@*: 'catalog:'
  # Only the Vite/Rolldown integration is used, so exclude this optional provider.
  unplugin@3.4.0>rollup: '-'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
